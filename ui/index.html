<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    
    <style>
        @font-face {
            font-family: 'bffont';
            src: url('bffont.ttf');
        }
    </style>

    <!-- 🔥 Fallback functions: prevent load order issues -->
    <script>
        (function() {
            var funcs = ['showUI','hideUI','showHintUI','showNVGAlert','iconsLocation','setKey','gogglesUpdate','setBatteries','batteryUpdate','playSound'];
            for (var i = 0; i < funcs.length; i++) {
                if (typeof window[funcs[i]] !== 'function') {
                    window[funcs[i]] = function(){};
                }
            }
        })();
    </script>
</head>
<body>

    <!-- 🔹 Hint area -->
    <div id="goggles-key-hint" class="bf3-blue-block" style="display: none;">
        <img class="goggles-hint-icon" src="img/goggles-icon.png" alt="NVG">
        <div class="hint">
                <div class="title-text">Night</div>
                <div class="action-row">
                    <span class="key-badge" id="key">[7]</span>
                    <span class="action-text">Enable/Disable</span>
                </div>
        </div>
    </div>

    <!-- 🔹 Bottom-right icon area -->
    <div id="goggles" style="display: none;">
        <img id="goggles-icon" src="img/goggles-off-icon.png" alt="NVG">
        <img id="goggles-battery-icon" src="img/battery-4.png" alt="Battery">
    </div>

    <!-- 🔹 Core logic script -->
    <script>
        var hint = document.getElementById('goggles-key-hint');
        var goggle = document.getElementById('goggles');
        var icon = document.getElementById('goggles-icon');
        var battery = document.getElementById('goggles-battery-icon');
        var key = document.getElementById('key');
        
        var batteryMin = 10;
        var batteryMax = 200;
        var batteryLast = -1;
        var batteryFlashing = false;
        
        window.showUI = function() {
            if (goggle) goggle.style.display = 'flex';
        };
        
        window.hideUI = function() {
            if (goggle) goggle.style.display = 'none';
            if (hint) hint.style.display = 'none';
        };
        
        window.showHintUI = function(seconds) {
            if (!hint) return;
            hint.style.display = 'block';
            var t = hint;
            setTimeout(function() { if (t) t.style.display = 'none'; }, (seconds || 10) * 1000);
        };
        
        window.showNVGAlert = function() {
            if (!goggle) return;
            goggle.classList.add("bounce");
            setTimeout(function() { if (goggle) goggle.classList.remove("bounce"); }, 1000);
        };
        
        window.iconsLocation = function(bottom, right) {
            if (goggle) {
                goggle.style.bottom = (typeof bottom === 'string') ? bottom : bottom + '%';
                goggle.style.right = (typeof right === 'string') ? right : right + '%';
            }
        };
        
        window.setKey = function(text) {
            if (key) key.textContent = "[ " + text.trim() + "]";
        };
        
        window.gogglesUpdate = function(state) {
            if (!icon) return;
            var img = "img/goggles-off-icon.png";
            if (state == 1) img = "img/goggles-icon.png";
            else if (state == 3) img = "img/goggles-disabled-icon.png";
            icon.src = img;
        };
        
        window.setBatteries = function(min, max) {
            batteryMin = min;
            batteryMax = max;
        };
        
        window.batteryUpdate = function(currentBattery) {
            if (!battery) return;
            
            if (currentBattery < batteryMin && currentBattery > 0) {
                if (!batteryFlashing) {
                    batteryFlashing = true;
                    flashBattery();
                }
            } else {
                batteryFlashing = false;
                var newBat = Math.ceil(currentBattery / batteryMax * 4);
                
                if (batteryLast != newBat && typeof window.playSound === 'function') {
                    try {
                        if (newBat == 4) playSound("sounds/NVG_Charged.ogg", 0.8, false);
                        else if (newBat == 0) playSound("sounds/NVG_Depleted.ogg", 0.8, false);
                        else if (batteryLast > newBat) playSound("sounds/NVG_Depleting.ogg", 0.8, false);
                        else playSound("sounds/NVG_Charging.ogg", 0.8, false);
                    } catch(e) {
                        console.log("[NVG] Sound error: " + e.message);
                    }
                }
                
                batteryLast = newBat;
                var batImg = "img/battery-" + Math.floor(newBat) + ".png";
                battery.src = batImg;
            }
        };
        
        function flashBattery() {
            if (!batteryFlashing || !battery) return;
            var currentSrc = battery.src;
            var isZero = currentSrc.indexOf('battery-0.png') >= 0;
            battery.src = isZero ? "img/battery-1.png" : "img/battery-0.png";
            setTimeout(flashBattery, 500);
        }
    </script>

    <!-- 🔹 AudioManager.js: GameFace compatible version (placed at the end) -->
    <script type="text/javascript" src="AudioManager.js"></script>

</body>
</html>
